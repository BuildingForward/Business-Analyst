name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test the CLI on sample data
        run: |
          python -m business_analyst screen --source data/sample_listings.csv
          python -m business_analyst run --source data/sample_listings.csv \
            --provider dry-run --out /tmp/reports --db /tmp/deals.db
          python -m business_analyst --db /tmp/deals.db prospect --no-google \
            --source data/sample_prospects.csv --handoff-dir /tmp/handoff
